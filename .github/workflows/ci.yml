name: CI

# Format, lint and unit tests on every branch push (a pull request runs it once,
# through its branch), skipping docs-only changes, on the
# same Ubuntu 24.04 base as the Dockerfile. Run the same checks locally with
#   ./dev.sh cargo fmt --check
#   ./dev.sh cargo clippy --all-targets -- -D warnings
#   ./dev.sh cargo test
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"

permissions:
  contents: read

# a newer push to the same ref replaces the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # same packages as debian/control Build-Depends (the unit tests need no display)
      - name: Install GTK 4, libadwaita, GtkSourceView 5, WebKitGTK 6 and libspelling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev libspelling-1-dev

      - name: Install Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # saves a fresh cache whenever the build changed (not only Cargo.lock) and
      # prunes stale artifacts, so target/ doesn't go stale and rebuild slowly
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
