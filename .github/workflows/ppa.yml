name: PPA

# Uploads a release to the Launchpad PPA (ppa:homielab/markdownmate).
# Runs on every v* tag, or by hand for an existing tag:
#   gh workflow run ppa.yml -f tag=v1.0.1
# Skipped until the PPA_GPG_PRIVATE_KEY secret is set; see README "Release".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload (e.g. v1.0.1)"
        required: true

permissions:
  contents: read

env:
  # Ubuntu series that get a build, one signed source upload each, version
  # <X.Y.Z-0ppaN>~<series>1. Only series Launchpad still supports
  # (https://launchpad.net/ubuntu/+series): drop one when it reaches end of life,
  # add a new release once Launchpad opens it.
  SERIES: noble resolute stonking

# one upload per tag at a time
concurrency:
  group: ppa-${{ inputs.tag || github.ref_name }}

jobs:
  ppa:
    runs-on: ubuntu-24.04
    env:
      PPA: ppa:homielab/markdownmate
      TAG: ${{ inputs.tag || github.ref_name }}
      PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
      PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
    steps:
      - name: Check the PPA secrets are set
        id: gate
        run: |
          if [ -n "$PPA_GPG_PRIVATE_KEY" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PPA upload skipped: the PPA_GPG_PRIVATE_KEY secret isn't set"; fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.on == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Install build tools
        if: steps.gate.outputs.on == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq devscripts debhelper dput git xz-utils cargo-1.91 rustc-1.91

      - name: Import the signing key
        if: steps.gate.outputs.on == 'true'
        run: |
          printf '%s\n' "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$PPA_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass"
          # debsign calls this instead of gpg, so the passphrase never needs a prompt
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase-file "%s" "$@"\n' \
            "$RUNNER_TEMP/gpg-pass" > "$RUNNER_TEMP/gpg-ci"
          chmod 700 "$RUNNER_TEMP/gpg-ci"
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Add a debian/changelog entry for this version (if there isn't one)
        if: steps.gate.outputs.on == 'true'
        run: |
          v=${TAG#v}
          cur=$(dpkg-parsechangelog -S Version)
          if [ "${cur%%-*}" != "$v" ]; then
            DEBFULLNAME=HomieLab DEBEMAIL=contact@homielab.com \
              dch -v "$v-0ppa1" -D noble "New upstream release, see CHANGELOG.md."
          fi
          echo "DEB_VERSION=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_ENV"

      # Launchpad takes each version once; a second upload only earns a
      # "Rejected: already accepted" email. (Uploads still in Launchpad's queue,
      # which can take hours, don't show up here yet.) Series already there are
      # skipped, so a re-run after adding a series uploads only the new one.
      - name: Skip the series whose version is already in the PPA
        id: new
        if: steps.gate.outputs.on == 'true'
        run: |
          todo=
          for s in $SERIES; do
            v="$DEB_VERSION~${s}1"
            n=$(curl -fsS "https://api.launchpad.net/devel/~homielab/+archive/ubuntu/markdownmate?ws.op=getPublishedSources&source_name=markdownmate&version=$v&exact_match=true" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["total_size"])')
            if [ "$n" = 0 ]; then todo="$todo $s"
            else echo "::notice::$v is already in the PPA; skipping $s. For a packaging-only fix, bump the suffix in debian/changelog (e.g. -0ppa2)."; fi
          done
          echo "TODO=${todo# }" >> "$GITHUB_ENV"
          if [ -n "$todo" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      # One .orig.tar.xz for every series (build-source.sh fails if a run made a different one).
      - name: Build and sign one source package per series
        if: steps.new.outputs.yes == 'true'
        run: |
          for s in $TODO; do
            SERIES=$s packaging/build-source.sh -us -uc
            debsign -p"$RUNNER_TEMP/gpg-ci" -k"$KEYID" "dist/ppa/markdownmate_$DEB_VERSION~${s}1_source.changes"
          done

      # Launchpad silently drops uploads whose signature it can't match to an
      # account, so check against the public key as the keyserver has it.
      - name: Verify the signatures the way Launchpad will
        if: steps.new.outputs.yes == 'true'
        run: |
          curl -fsS "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$KEYID" | gpg --dearmor > "$RUNNER_TEMP/keyserver.gpg"
          for f in dist/ppa/*_source.changes dist/ppa/*.dsc; do gpgv --keyring "$RUNNER_TEMP/keyserver.gpg" "$f"; done

      - name: Keep the signed upload
        if: steps.new.outputs.yes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ppa-upload
          path: dist/ppa/
          retention-days: 14

      # One after another: the first upload brings the .orig.tar.xz, the next ones carry the same file.
      # A series whose upload fails (Launchpad's FTP sometimes answers 550) is tried again after
      # 2, 5 and 10 minutes; the step fails, naming it, only if its last try fails too.
      - name: Upload to the PPA
        if: steps.new.outputs.yes == 'true'
        run: |
          read -r -a todo <<< "$TODO"
          packaging/upload-ppa.sh "${todo[@]}"

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/gpg-pass" "$RUNNER_TEMP/gpg-ci"; rm -rf ~/.gnupg
