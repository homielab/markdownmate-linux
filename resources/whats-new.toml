# What's New in MarkdownMate (Main menu ▸ What's New, Preferences ▸ About, About dialog).
# One [[release]] per version, newest first: 3–5 short notes, plain text, the same as that
# version's CHANGELOG.md section and metainfo <release>. show = true only for X.Y.0 feature
# releases: those badge the menu once after an update. Versions newer than Cargo.toml's are
# ignored, so the next release's entry can be written ahead.

[[release]]
version = "0.9.0"
show = true
notes = [
    "Find Broken Links, Find Open Tasks and Find Unused Attachments in the main menu; Find in Folder from a folder's right-click menu.",
    "Export Folder as HTML, and a preview of the linked note when you hover a [[wiki link]].",
    "Tags and aliases in YAML front matter; New Note from Selection; Previous and Next Daily Note.",
    "Templates: starter templates, {{time}}, {{cursor}} and formatted dates; auto-pairing of brackets and quotes; smart punctuation.",
    "New Note and Today's Note in the dock icon's menu; drag a note into the editor to link it.",
]

[[release]]
version = "0.8.0"
show = true
notes = [
    "Favorites: pin notes and folders at the top of the sidebar; Duplicate and Move to Folder… in the sidebar's right-click menu.",
    "Find in Folder: Match Case, Whole Word and Regex toggles, and Replace All across the folder.",
    "Back and Forward (Alt+Left / Alt+Right) between the notes you opened, like a browser.",
    "Highlights with ==text==, New from Template, Rename Tag, a [TOC] table of contents and GitHub-style alerts.",
    "Preferences ▸ About: What's New, Send Feedback, Share MarkdownMate and more.",
]

[[release]]
version = "0.7.0"
show = true
notes = [
    "A new app icon with a bolder, solid M↓ mark, the same as on the Mac.",
    "Preferences ▸ Appearance ▸ Line Breaks: Every New Line shows each newline in a paragraph as a line break in the preview, print and exports.",
]
